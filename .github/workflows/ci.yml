name: CI

# Detección de errores en cada PR: compila el paquete y corre los tests del motor.
# Si algo no compila o un test falla, el PR queda marcado en rojo.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela ejecuciones antiguas de la misma rama/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (motor)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Swift
        run: swift --version

      - name: Compilar y testear (FilePackrCore)
        # Los tests de interop (zip/unzip/pyzipper) se saltan solos con XCTSkipUnless
        # si la herramienta no está, así que el runner queda en verde sin instalar nada.
        run: swift test
